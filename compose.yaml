services:
  postgres:
    image: postgres:16-alpine
    container_name: employee-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d employee_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    container_name: employee-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
