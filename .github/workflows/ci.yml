cat > .github/workflows/ci.yml <<'EOF'
name: Employee API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          image-ref: employee-api:1.0.0
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '0'

      - name: Test API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Test employee creation
        run: |
          curl -fsS -X POST http://localhost:3000/employees \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Test","email":"ci@example.com","role":"DevOps Engineer"}'

      - name: Test employee retrieval
        run: |
          curl -fsS http://localhost:3000/employees \
            | grep -q "ci@example.com"

      - name: Display container logs
        if: always()
        run: docker compose logs || true

      - name: Clean up
        if: always()
        run: docker compose down -v
EOF
